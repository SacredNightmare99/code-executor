version: "3.8"

services:
  # Code Executor API
  code-executor:
    build:
      context: ..
      dockerfile: deployment/docker/server.Dockerfile
    container_name: code-executor
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - NODE_ENV=production
      - WORKERS=1
      - MAX_CONCURRENT=2
      - REDIS_URL=redis://redis:6379
      - PORT=4000
      - SANDBOX_MEMORY=128m
      # Fail fast: production refuses to start without a strong JWT secret.
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in the environment}
      # Runner workspaces must be visible to the host Docker daemon at the same
      # absolute path (run `docker compose` from the repo root so ${PWD} matches).
      - RUNNER_WORKSPACE=${PWD}/deployment/.runnix-workspace
    # The sandbox spawns Docker containers, so the host daemon socket is
    # required. Without it, job execution will fail with SYSTEM_ERROR.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.runnix-workspace:${PWD}/deployment/.runnix-workspace
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "60"
      - "100"
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    networks:
      - monitoring
    depends_on:
      - code-executor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Grafana
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
