name: Deploy

on:
  # Deploy ONLY on tagged releases (e.g. v0.1.0). CI still runs on every
  # push/PR to main; deployment is gated behind a version tag.
  push:
    tags:
      - "v*"
  # Manual override for emergency deploys. Requires a ref; the default "main"
  # is only used for manual runs — normal deploys come from tags.
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default: main)"
        required: false
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to OCI VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          # Image rebuilds can be slow on a 1GB box.
          command_timeout: 20m
          script: |
            set -e
            cd ~/runnix
            RELEASE_REF="${{ github.ref_type == 'tag' && github.ref_name || inputs.ref }}"
            git fetch origin --tags
            PREV=$(git rev-parse HEAD)
            # Resolve the ref to a commit, preferring the (fresh) remote-tracking
            # branch for branch deploys; fall back to the tag itself. Checking out
            # a stale local branch (e.g. main left behind after a tag deploy)
            # would redeploy an old revision.
            RELEASE_COMMIT=$(git rev-parse --verify "origin/${RELEASE_REF}^{commit}" 2>/dev/null \
              || git rev-parse --verify "${RELEASE_REF}^{commit}")
            git checkout -f "$RELEASE_COMMIT"
            bash scripts/deploy-remote.sh "$RELEASE_REF" "$PREV"
